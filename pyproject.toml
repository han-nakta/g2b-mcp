[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "g2b-procurement-intelligence"
version = "0.2.0"
description = "Public-safe G2B OpenAPI catalog, relationship evidence, ontology, and MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "han.nakta"}]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
test = []

[project.scripts]
g2b-mcp = "g2b_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/g2b_mcp", "src/g2b_openapi", "src/g2b_graph"]

[tool.hatch.build.targets.wheel.force-include]
"artifacts" = "g2b_mcp/artifacts"

[tool.hatch.build.targets.sdist]
include = ["src", "artifacts", "docs", "tests", "README.md", "LICENSE", "SECURITY.md", "DATA_BOUNDARY.md", ".env.example"]
